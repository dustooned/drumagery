<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Visual Instrument Prototype</title>
    <script type="module" crossorigin src="/drumagery/assets/index-BX3GGYlC.js"></script>
    <link rel="stylesheet" crossorigin href="/drumagery/assets/index-DE4z-0GM.css">
  </head>
  <body>
    <main id="app">
      <section id="stage-area" aria-label="Visual instrument workspace">
        <div id="stage" aria-label="Visual instrument stage">
          <button id="fullscreen-exit" type="button" aria-label="Exit fullscreen">Exit</button>
          <nav id="performance-edge-dock" aria-label="Performance edge dock"></nav>
        </div>
        <div id="stage-actions" aria-label="Stage actions">
          <button id="midi-connect" type="button">Connect MIDI</button>
          <button id="midi-learn-reset" type="button">Clear MIDI Learn</button>
          <button id="kill-loops" type="button">Kill Loops</button>
          <button id="reset-state" type="button">Reset</button>
          <button id="mobile-grid-toggle" type="button" aria-pressed="false">Big grid</button>
          <button id="fullscreen-toggle" type="button" aria-pressed="false">Fullscreen</button>
        </div>
      </section>
      <button id="debug-toggle" type="button" aria-controls="debug-panel" aria-expanded="true">
        Hide controls
      </button>
      <section id="debug-panel" aria-label="Debug controls"></section>
    </main>
  </body>
</html>
